spring.application.name=civicflow

spring.datasource.url=jdbc:postgresql://localhost:5432/civicflow
spring.datasource.username=postgres
spring.datasource.password=112

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080
civicflow.timezone=${CIVICFLOW_TIMEZONE:UTC}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=CivicFlow
info.app.description=Community issue management platform
info.app.version=1.0.0