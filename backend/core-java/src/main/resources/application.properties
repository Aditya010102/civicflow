spring.application.name=civicflow

# ---------------------------------------------------------
# Database
# ---------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${CIVICFLOW_DB_URL:jdbc:postgresql://localhost:5432/civicflow}
spring.datasource.username=${CIVICFLOW_DB_USERNAME:postgres}
spring.datasource.password=${CIVICFLOW_DB_PASSWORD}

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------
# Server
# ---------------------------------------------------------

server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------
# CivicFlow application timezone
# ---------------------------------------------------------

civicflow.timezone=${CIVICFLOW_TIMEZONE:UTC}

# ---------------------------------------------------------
# Spring Boot Actuator
# ---------------------------------------------------------

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------
# Application information
# ---------------------------------------------------------

info.app.name=CivicFlow
info.app.description=Community issue management platform
info.app.version=1.0.0

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------

logging.level.com.civicflow=INFO

# ---------------------------------------------------------
# JWT
# ---------------------------------------------------------

civicflow.jwt.secret=${CIVICFLOW_JWT_SECRET}
civicflow.jwt.expiration-ms=${CIVICFLOW_JWT_EXPIRATION_MS:3600000}
civicflow.services.department.base-url=${CIVICFLOW_DEPARTMENT_URL:http://localhost:8083}
civicflow.notifications.enabled=${CIVICFLOW_NOTIFICATIONS_ENABLED:true}

civicflow.rate-limit.enabled=${CIVICFLOW_RATE_LIMIT_ENABLED:true}
civicflow.rate-limit.requests-per-minute=${CIVICFLOW_RATE_LIMIT_REQUESTS_PER_MINUTE:60}

civicflow.cors.allowed-origin=${CIVICFLOW_CORS_ALLOWED_ORIGIN:http://localhost:4200}